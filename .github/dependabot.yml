version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"   
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"    
    groups:
      dependencies:
        patterns:
          - "*"

